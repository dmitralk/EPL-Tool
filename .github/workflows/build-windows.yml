name: Build Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Path filters are not applied to tag pushes, so every v* tag builds and releases.
    tags: ['v*']
    paths:
      - 'epl-tool/**'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    defaults:
      run:
        working-directory: epl-tool

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @electron/rebuild 4.x (used by Forge) requires Node >= 22.12
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: epl-tool/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build Windows package
        run: npm run make

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EPL-Tool-Windows
          path: |
            epl-tool/out/make/squirrel.windows/**
            epl-tool/out/make/zip/win32/**
          if-no-files-found: warn
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # checkout stores the tag as lightweight; re-fetch it so --notes-from-tag sees the annotation
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" \
            out/make/squirrel.windows/*/*.exe \
            out/make/zip/win32/*/*.zip \
            --title "EPL Tool $GITHUB_REF_NAME" \
            --notes-from-tag
